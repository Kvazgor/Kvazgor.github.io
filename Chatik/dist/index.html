<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Бэт-связь</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-window">
    <h2>Введите бэт-ник</h2>
    <form id="login-form">
      <input type="text" id="nickname-input" placeholder="Бэт-ник (макс. 25 бэт-символов)" required>
      <button type="submit">Войти в чат</button>
    </form>
    <p id="login-error" style="display: none;"></p>
  </div>
<div id="chat-window" style="display: none;">
    <div class="chat-header">
      <h2>Бэт-связь активна</h2>
      <button type="button" id="logout-btn">Выйти</button>
    </div>    
    <div id="main"></div>
    <form id="chat-form">
      <input type="text" id="message-input" placeholder="Введите бэт-сообщение..." required>
      <button type="submit">Отправить</button>
    </form>
  </div>  <script src="bundle.js"></script>
</body>
</html>
